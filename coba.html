    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Preview</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Daftar Produk -->
    <div class="product-container">
        <div class="product" data-name="product1">
            <img src="https://via.placeholder.com/150" alt="Produk 1">
            <h3>Produk 1</h3>
        </div>
        <div class="product" data-name="product2">
            <img src="https://via.placeholder.com/150" alt="Produk 2">
            <h3>Produk 2</h3>
        </div>
    </div>

    <!-- Popup Preview -->
    <div class="popup-container">
        <div class="popup-box" data-target="product1">
            <span class="close">&times;</span>
            <h2>Produk 1</h2>
            <p>Detail produk 1...</p>
        </div>
        <div class="popup-box" data-target="product2">
            <span class="close">&times;</span>
            <h2>Produk 2</h2>
            <p>Detail produk 2...</p>
        </div>
    </div>

</body>
</html>
